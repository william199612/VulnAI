services:
  postgres:
    image: postgres:16
    container_name: vulnai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - vulnai_pgdata:/var/lib/postgresql/data
      - ./data_pipeline/db/init:/docker-entrypoint-initdb.d

volumes:
  vulnai_pgdata:
